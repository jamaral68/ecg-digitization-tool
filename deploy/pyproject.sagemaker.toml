[tool.poetry]
name = "ecg-digitization-tool"
version = "0.0.1"
description = "ECG digitization - SageMaker build (CUDA)"
authors = ["Luan Rodrigues Jorge Amaral"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.4.1"
pandas = "^2.3.3"
matplotlib = "^3.10.8"
scipy = "^1.17.0"
opencv-python = "^4.13.0.90"
pillow = "^12.1.0"
pytesseract = "^0.3.13"
boto3 = "^1.42.30"
scikit-image = "^0.26.0"
ocrd-fork-pylsd = "^0.0.8"
torch = {version = "^2.3.1", source = "pytorch-cu121"}
torchvision = {version = "^0.18.1", source = "pytorch-cu121"}
nbconvert = "^7.17.0"
botocore = {extras = ["crt"], version = "^1.42.61"}
python-dotenv = "^1.2.2"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
